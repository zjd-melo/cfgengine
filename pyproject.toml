[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xr-cfgengine"
version = "2.1.0"
description = "A simple Python library to manage and load configuration files"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "xr", email = "xr@xrwangluo.com" }
]
keywords = ["config"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

dependencies = [
    "jinja2>=3.0.0"
]

[project.optional-dependencies]
nacos = ["nacos-sdk-python=1.0.0"]



[project.urls]
Homepage = "https://gitlab.xurongwl.com/datascience/cfgengine"
Repository = "https://gitlab.xurongwl.com/datascience/cfgengine/-/tree/main"
Issues = "https://gitlab.xurongwl.com/datascience/cfgengine/-/issues"


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
# 添加 src 到 sys.path
pythonpath = ["src"]
addopts = "-v -s --tb=short"
